name: Pages

# Publishes the rendered concept reports (docs/reports, built by
# scripts/build_reports.py) to GitHub Pages whenever they change on main.

on:
  push:
    branches: [main]
    paths: ["docs/reports/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish reports
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/reports
      - id: deployment
        uses: actions/deploy-pages@v5
