name: Teardown

# Removes the portal from AWS through scripts/teardown.sh. Scope "app" (default) removes the
# pay-per-use application stack and keeps certificate, base and edge, so the next deploy
# returns under the same address without DNS changes. Scope "all" removes every stack;
# only the CDK bootstrap and the Terraform foundation remain.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to remove the portal from AWS'
        required: true
      scope:
        description: "app = application only (address stays), all = every stack"
        type: choice
        options: [app, all]
        default: app

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-production
  cancel-in-progress: false

jobs:
  teardown:
    name: CDK destroy
    if: github.repository == 'janpfeil/kundenportal-demo' && inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The CDK app needs the built shell and packages to synthesise.
      - run: pnpm build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-teardown-${{ github.run_id }}
          aws-region: eu-central-1
      - name: Teardown (scripts/teardown.sh)
        shell: bash # with pipefail, so a failure behind tee fails the step
        run: ./scripts/teardown.sh ${{ inputs.scope == 'all' && '--all' || '' }} | tee teardown.log
      - name: Summary
        run: grep -E '_SECONDS=' teardown.log >> "$GITHUB_STEP_SUMMARY"
