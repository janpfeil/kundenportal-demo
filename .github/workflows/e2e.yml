name: E2E

# Playwright run against the live portal: start page in both languages, sign-in via
# Cognito managed login with a throw-away user, account page and mailbox, the zones'
# journeys (J4, J6) and the migration journeys (J2, J3, J7, J8; skipped without the
# LEGACY_DEMO_PASSWORD secret).

on:
  workflow_dispatch:
    inputs:
      portal_url:
        description: Portal URL
        default: https://kundenportal-demo.rypox.com
      screens:
        description: Only take screenshots of every screen (visual check, see screens.spec.ts)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  e2e:
    name: Playwright (live)
    if: github.repository == 'janpfeil/kundenportal-demo'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kundenportal/e2e exec playwright install --with-deps chromium
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-e2e-${{ github.run_id }}
          aws-region: eu-central-1
      - name: Run
        env:
          PORTAL_URL: ${{ inputs.portal_url }}
          # Phase 3: password of the demo persons in both legacy systems (environment secret).
          LEGACY_DEMO_PASSWORD: ${{ secrets.LEGACY_DEMO_PASSWORD }}
          E2E_SCREENS: ${{ inputs.screens && '1' || '' }}
        run: pnpm --filter @kundenportal/e2e run e2e ${{ inputs.screens && 'src/screens.spec.ts' || '' }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
