name: E2E

# Playwright run of the first slice against the live portal: start page in both
# languages, sign-in via Cognito managed login with a throw-away user, account page
# from GET /api/me and the welcome message in the demo mailbox.

on:
  workflow_dispatch:
    inputs:
      portal_url:
        description: Portal URL
        default: https://kundenportal-demo.rypox.com

permissions:
  contents: read
  id-token: write

jobs:
  e2e:
    name: Playwright (live)
    if: github.repository == 'janpfeil/kundenportal-demo'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kundenportal/e2e exec playwright install --with-deps chromium
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-e2e-${{ github.run_id }}
          aws-region: eu-central-1
      - name: Run
        env:
          PORTAL_URL: ${{ inputs.portal_url }}
        run: pnpm --filter @kundenportal/e2e run e2e
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
