name: CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turbo's task cache and Next.js' build cache (saved below). App builds hash GITHUB_SHA (the version in
      # every page), so they run once per commit; a warm Next.js cache makes them about twice
      # as fast. CI on develop fills the cache the deployment of the same commit restores.
      - uses: actions/cache/restore@v6
        with:
          path: |
            .turbo/cache
            apps/*/.next/cache
          key: build-${{ runner.os }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Already part of the build; listed separately so a broken CDK app is obvious.
      - name: CDK synth
        run: pnpm turbo run build --filter=@kundenportal/infra-cdk
      # App and CDK entries (10 to 500 MB) change with every commit, and the restored cache
      # only grows: keep the large ones and anything older than two weeks out of the save.
      - name: Trim the build cache
        if: always()
        run: |
          find .turbo/cache -name '*.tar.zst' \( -size +5M -o -mtime +14 \) 2>/dev/null |
            while read -r entry; do rm -f "$entry" "${entry%.tar.zst}"-*.json; done
      # Only develop and main save it (about 290 MB each): feature branches read their
      # base branch's cache, so short-lived branches do not crowd GitHub's 10 GB limit.
      - if: always() && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: actions/cache/save@v6
        with:
          path: |
            .turbo/cache
            apps/*/.next/cache
          key: build-${{ runner.os }}-${{ github.sha }}
