name: Deploy

# Manual deployment of the application (CDK) to AWS. The job runs in the GitHub
# environment "production", which requires the owner's approval, and gets AWS access
# only through OIDC (role from Terraform, no access keys). Workflows triggered by pull
# requests from forks never reach this environment.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-production
  cancel-in-progress: false

jobs:
  deploy:
    name: CDK deploy
    if: github.repository == 'janpfeil/kundenportal-demo'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-deploy-${{ github.run_id }}
          aws-region: eu-central-1
      - name: Deploy (scripts/deploy.sh)
        env:
          # 0 while the account's Lambda concurrency limit is too low to reserve any.
          RESERVED_CONCURRENCY: ${{ vars.RESERVED_CONCURRENCY || '2' }}
        shell: bash # with pipefail, so a failure behind tee fails the step
        run: ./scripts/deploy.sh | tee deploy.log
      - name: Summary
        run: |
          {
            echo "## Deployment"
            echo '```'
            grep -E '_SECONDS=' deploy.log
            echo '```'
            echo "## Outputs"
            echo '```json'
            cat infra/cdk/cdk-outputs.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
