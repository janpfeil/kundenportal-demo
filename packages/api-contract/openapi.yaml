openapi: 3.1.0
info:
  title: Kundenportal API
  version: 0.1.0
  description: >-
    REST API of the customer portal. The tenant is always taken from the access token,
    never from the URL. Errors follow RFC 9457 (problem details). Every operation lists
    the OAuth 2.0 scopes it requires; the API gateway enforces them per route.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api
security:
  - oidc: []
paths:
  /me:
    get:
      operationId: getMe
      summary: Profile of the signed-in customer (created on first access)
      security:
        - oidc: [kundenportal/profile.read]
      responses:
        "200":
          description: Customer profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "401": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateMe
      summary: Change editable profile fields
      security:
        - oidc: [kundenportal/profile.write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerUpdate" }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /notifications:
    get:
      operationId: listNotifications
      summary: Demo mailbox of the signed-in customer, newest first
      security:
        - oidc: [kundenportal/notifications.read]
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
        "401": { $ref: "#/components/responses/Problem" }
  /notifications/{notificationId}:
    patch:
      operationId: markNotificationRead
      summary: Mark a notification as read
      security:
        - oidc: [kundenportal/notifications.write]
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [read]
              properties:
                read: { type: boolean, const: true }
      responses:
        "204": { description: Marked as read }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /contracts:
    get:
      operationId: listContracts
      summary: Contracts of the signed-in customer across all divisions
      description: >-
        A newly registered customer receives demo contracts (electricity, gas, mobile)
        a moment after the first sign-in; until then the list is empty.
      security:
        - oidc: [kundenportal/contracts.read]
      responses:
        "200":
          description: Contracts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Contract" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /contracts/{contractId}:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    get:
      operationId: getContract
      summary: One contract of the signed-in customer
      security:
        - oidc: [kundenportal/contracts.read]
      responses:
        "200":
          description: Contract
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateContract
      summary: Change the monthly installment or the tariff option
      description: >-
        The installment of a metered contract (electricity, gas, water) may be set in
        whole euros between `installmentMinCent` and `installmentMaxCent`. A new tariff
        option moves that range and keeps the installment inside it; for internet and
        mobile the monthly price follows the option. Publishes `ContractChanged`.
      security:
        - oidc: [kundenportal/contracts.write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContractUpdate" }
      responses:
        "200":
          description: Updated contract
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /contracts/{contractId}/readings:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    get:
      operationId: listMeterReadings
      summary: Meter readings of a contract, newest first
      description: The first entry is the reading at contract start.
      security:
        - oidc: [kundenportal/readings.read]
      responses:
        "200":
          description: Meter readings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MeterReading" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: submitMeterReading
      summary: Submit a meter reading
      description: >-
        Plausibility: the contract has a meter, the date is not in the future (German
        time) and neither value nor date are below the latest reading. Publishes
        `MeterReadingSubmitted`; the contract domain then recalculates the installment.
      security:
        - oidc: [kundenportal/readings.write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewMeterReading" }
      responses:
        "201":
          description: Stored reading
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeterReading" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /contracts/{contractId}/usage:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    get:
      operationId: getDataUsage
      summary: Data volume used this month (mobile contracts, demo values)
      security:
        - oidc: [kundenportal/readings.read]
      responses:
        "200":
          description: Data usage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataUsage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /documents:
    get:
      operationId: listDocuments
      summary: Documents of the signed-in customer, newest first
      security:
        - oidc: [kundenportal/documents.read]
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Document" }
        "401": { $ref: "#/components/responses/Problem" }
  /documents/upload-url:
    post:
      operationId: createUploadUrl
      summary: Announce an upload and get a presigned PUT URL
      description: >-
        The URL is valid for five minutes and accepts exactly the announced content type
        and size (both are signed): send `PUT` with the returned headers and the file as
        body. After the upload arrives the document becomes `uploaded` and
        `DocumentUploaded` is published. Files are deleted after seven days. A demo pass
        may request 20 upload URLs; after that the answer is 429 ("Kontingent erschöpft").
      security:
        - oidc: [kundenportal/documents.write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadUrlRequest" }
      responses:
        "201":
          description: Upload ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadTicket" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /me/links:
    get:
      operationId: listLinks
      summary: Offers to link a second legacy account, and confirmed links
      description: >-
        After a migration the portal looks for the same person in the other legacy system
        (name plus normalised address, birth date or email). Each hit is an offer here and
        in the mailbox (`DuplicateCandidateFound`).
      security:
        - oidc: [kundenportal/profile.read]
      responses:
        "200":
          description: Link offers of the signed-in customer
          content:
            application/json:
              schema:
                type: object
                required: [links]
                properties:
                  links:
                    type: array
                    items: { $ref: "#/components/schemas/LinkOffer" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: confirmLink
      summary: Link an offered legacy account (proof by its password)
      description: >-
        The password of the other legacy account proves ownership; it is checked by that
        legacy system (utility REST or the telco's Keycloak) and never stored. The
        account's contracts move to the signed-in customer (`AccountsLinked`). Repeating
        a confirmed link answers the link again.
      security:
        - oidc: [kundenportal/profile.write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkRequest" }
      responses:
        "200":
          description: The link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkOffer" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /migration/status:
    get:
      operationId: getMigrationStatus
      summary: Migration cockpit — progress, clarification cases, dead letters, timeline
      description: Owner only (Cognito group `owner`).
      security:
        - oidc: [kundenportal/migration.read]
      responses:
        "200":
          description: Cockpit data of the caller's tenant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /migration/bulk:
    post:
      operationId: startBulkMigration
      summary: Start the bulk import of the inactive accounts of one legacy system
      description: >-
        Owner only. Accounts without sign-in for 12 months are taken over without their
        password (`PasswordResetRequired`); active ones wait for their first sign-in
        (lazy migration). Runs asynchronously; progress in `/migration/status`.
      security:
        - oidc: [kundenportal/migration.write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [system]
              additionalProperties: false
              properties:
                system: { $ref: "#/components/schemas/LegacySystem" }
      responses:
        "202":
          description: Run started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationRun" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /migration/reset:
    post:
      operationId: resetMigration
      summary: Demo reset — remove migrated accounts and the migration state
      description: >-
        Owner only. Deletes the portal accounts created by the migration (lazy and bulk;
        never the caller's own), the tenant's migration records and runs, and empties the
        migration DLQ, so the journeys can be shown again. The legacy systems keep their
        data.
      security:
        - oidc: [kundenportal/migration.write]
      responses:
        "200":
          description: What was removed
          content:
            application/json:
              schema:
                type: object
                required: [accountsRemoved, recordsRemoved]
                properties:
                  accountsRemoved: { type: integer }
                  recordsRemoved: { type: integer }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /migration/dlq/{recordId}/redrive:
    post:
      operationId: redriveMigrationRecord
      summary: Process a failed record again, optionally with corrections
      description: >-
        Owner only. Takes the record's task out of the migration dead-letter queue and
        hands it to the processor again. Corrections (e.g. a missing postal code) apply
        to the takeover only; the legacy system stays untouched.
      security:
        - oidc: [kundenportal/migration.write]
      parameters:
        - name: recordId
          in: path
          required: true
          description: Opaque id from `MigrationStatus.deadLetters[].id`
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                corrections: { $ref: "#/components/schemas/MigrationCorrections" }
      responses:
        "202":
          description: Record queued again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationRecord" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tenancy/invitations:
    post:
      operationId: createInvitation
      summary: Create an invitation link for a demo pass
      description: >-
        Owner only (Cognito group `owner`). The link is valid for 14 days and can be
        redeemed once; its token sits in the URL fragment and is stored only as a hash.
        `validMinutes` creates a short test pass (end-to-end tests) whose holder gets no
        Cognito mail.
      security:
        - oidc: [kundenportal/tenancy.admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
                validMinutes: { type: integer, minimum: 1, maximum: 60 }
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                type: object
                required: [invitationId, link, expiresAt]
                properties:
                  invitationId: { type: string }
                  link: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /tenancy/passes:
    get:
      operationId: listPasses
      summary: All demo passes with status and quota usage
      description: Owner only.
      security:
        - oidc: [kundenportal/tenancy.admin]
      responses:
        "200":
          description: Passes, newest first
          content:
            application/json:
              schema:
                type: object
                required: [passes]
                properties:
                  passes:
                    type: array
                    items: { $ref: "#/components/schemas/PassSummary" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /tenancy/passes/{passId}/revoke:
    post:
      operationId: revokePass
      summary: End a demo pass early
      description: Owner only. The tenant is torn down asynchronously (`DemoPassExpired`).
      security:
        - oidc: [kundenportal/tenancy.admin]
      parameters:
        - name: passId
          in: path
          required: true
          schema: { type: string }
      responses:
        "202":
          description: Teardown started
          content:
            application/json:
              schema:
                type: object
                required: [passId, tenantId, status]
                properties:
                  passId: { type: string }
                  tenantId: { type: string }
                  status: { $ref: "#/components/schemas/TenantStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tenancy/pass:
    get:
      operationId: getOwnPass
      summary: The demo pass of the caller's tenant
      description: >-
        Status, end date and quota of the pass behind the tenant in the token. The pass
        holder (group `pass`) and the owner also get the demo persons' sign-in names and
        the tenant's demo password. For the owner's tenant the status is `owner`.
      security:
        - oidc: [kundenportal/tenancy.read]
      responses:
        "200":
          description: Own pass
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnPass" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /tenancy/settings:
    get:
      operationId: getSettings
      summary: Platform settings of the demo passes
      description: >-
        Owner only. Kill switch (`redemption`, with when and why it was closed), the cap
        of concurrent pass tenants and how many are in use (every tenant that is not
        deleted, including ones being set up or torn down).
      security:
        - oidc: [kundenportal/tenancy.admin]
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformSettings" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateSettings
      summary: Open or close redeeming and set the cap of concurrent pass tenants
      description: >-
        Owner only. At least one field. Reopening clears `closedAt` and `closedReason`;
        closing keeps an earlier reason (e.g. the budget alarm's). The cap is at most 4:
        each pass tenant has its own table with 5 read and 5 write capacity units, and
        the free tier's 25 units cover the base table plus four tenants. A cap below the
        tenants in use only stops new redemptions.
      security:
        - oidc: [kundenportal/tenancy.admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsUpdate" }
      responses:
        "200":
          description: Settings after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformSettings" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /tenancy/offer:
    get:
      operationId: getOffer
      summary: What a demo pass offers, for the redeem page
      description: >-
        Public and the same for every visitor (no personal data); cacheable for 60
        seconds (`Cache-Control: public, max-age=60`). Duration, quotas and upload size
        come from the configuration; `redemptionOpen` is false while redeeming is
        closed or every pass tenant is taken.
      security: []
      responses:
        "200":
          description: Offer
          headers:
            Cache-Control:
              schema: { type: string, example: "public, max-age=60" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassOffer" }
  /tenancy/challenge:
    get:
      operationId: getRedeemChallenge
      summary: ALTCHA proof-of-work challenge for redeeming a link
      description: >-
        Public. A signed challenge (protocol v2, PBKDF2/SHA-256) the ALTCHA widget solves
        in about a second; valid for 10 minutes.
      security: []
      responses:
        "200":
          description: Challenge
          content:
            application/json:
              schema:
                type: object
                required: [parameters, signature]
                properties:
                  parameters: { type: object, additionalProperties: true }
                  signature: { type: string }
  /tenancy/redeem:
    post:
      operationId: redeemInvitation
      summary: Redeem an invitation link and receive a demo pass
      description: >-
        Public. Needs a solved ALTCHA challenge (each one once); at most 10 attempts per
        address and hour. The tenant is set up asynchronously; the holder receives the
        one-time password of the new account by e-mail.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, altcha]
              additionalProperties: false
              properties:
                token: { type: string, description: The token from the link's fragment }
                altcha: { type: string, description: Base64 payload of the ALTCHA widget }
      responses:
        "202":
          description: Pass issued, tenant being set up
          content:
            application/json:
              schema:
                type: object
                required: [passId, statusUrl]
                properties:
                  passId: { type: string }
                  statusUrl: { type: string, format: uri }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
components:
  parameters:
    ContractId:
      name: contractId
      in: path
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    oidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Access token (JWT) of any standard OpenID Connect provider trusted by the API
        gateway; in the demo this is the Amazon Cognito user pool. The token must carry
        the scopes listed on each operation (`scope` claim, space separated).
  responses:
    Problem:
      description: Error as problem details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Locale:
      type: string
      enum: [de, en]
    Customer:
      type: object
      required: [customerId, email, displayName, locale, origin, createdAt]
      properties:
        customerId: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        locale: { $ref: "#/components/schemas/Locale" }
        origin:
          type: string
          enum: [registration, legacy-utility, legacy-telco]
        createdAt: { type: string, format: date-time }
        address: { $ref: "#/components/schemas/PostalAddress" }
        phone: { type: string, description: Taken over from a legacy system }
        legacyAccounts:
          type: array
          description: Legacy accounts behind this customer, e.g. `utility:V-1000123`
          items: { type: string }
    PostalAddress:
      type: object
      required: [street, houseNumber, postalCode, city]
      properties:
        street: { type: string }
        houseNumber: { type: string }
        postalCode: { type: string, pattern: "^\\d{5}$" }
        city: { type: string }
    CustomerUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
        locale: { $ref: "#/components/schemas/Locale" }
    Notification:
      type: object
      required: [notificationId, kind, title, body, createdAt, read]
      properties:
        notificationId: { type: string }
        kind: { type: string, enum: [welcome, info, warning] }
        title: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }
    Division:
      type: string
      enum: [electricity, gas, water, internet, mobile]
    MeterUnit:
      type: string
      enum: [kWh, m3]
    Contract:
      type: object
      description: Amounts are integer euro cents.
      required:
        - contractId
        - division
        - tariffName
        - tariffOption
        - tariffOptions
        - monthlyInstallmentCent
        - installmentAdjustable
        - monthlyPriceCent
        - startDate
        - minimumTermMonths
        - minimumTermEndDate
        - status
        - updatedAt
      properties:
        contractId: { type: string, format: uuid }
        division: { $ref: "#/components/schemas/Division" }
        tariffName: { type: string }
        tariffOption: { type: string }
        tariffOptions:
          type: array
          description: Options the customer may switch to
          items: { type: string }
        monthlyInstallmentCent:
          type: integer
          minimum: 0
          description: Installment (metered) or fixed monthly price (internet, mobile)
        installmentAdjustable: { type: boolean }
        installmentMinCent: { type: integer, minimum: 0 }
        installmentMaxCent: { type: integer, minimum: 0 }
        meterNumber: { type: string }
        unit: { $ref: "#/components/schemas/MeterUnit" }
        workPriceCent: { type: integer, minimum: 0, description: Price per kWh or m³ }
        monthlyPriceCent:
          type: integer
          minimum: 0
          description: Monthly base price (metered) or monthly price of the option
        estimatedAnnualConsumption: { type: number, minimum: 0 }
        dataVolumeMb: { type: integer, minimum: 1 }
        startDate: { type: string, format: date }
        minimumTermMonths: { type: integer, minimum: 1 }
        minimumTermEndDate: { type: string, format: date }
        status: { type: string, enum: [active, terminated] }
        updatedAt: { type: string, format: date-time }
    ContractUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        monthlyInstallmentCent:
          type: integer
          minimum: 1
          description: Whole euros (multiple of 100) within the contract's allowed range
        tariffOption: { type: string, minLength: 1, maxLength: 40 }
    MeterReading:
      type: object
      required: [readingId, value, unit, readAt, source, submittedAt]
      properties:
        readingId: { type: string }
        value: { type: number, minimum: 0 }
        unit: { $ref: "#/components/schemas/MeterUnit" }
        readAt: { type: string, format: date }
        source: { type: string, enum: [contract-start, customer] }
        submittedAt: { type: string, format: date-time }
    NewMeterReading:
      type: object
      required: [value, readAt]
      additionalProperties: false
      properties:
        value: { type: number, minimum: 0, maximum: 1000000000 }
        readAt: { type: string, format: date }
    DataUsage:
      type: object
      required: [contractId, month, includedMb, usedMb, usedPercent, thresholdPercent, asOf]
      properties:
        contractId: { type: string, format: uuid }
        month: { type: string, pattern: "^\\d{4}-\\d{2}$" }
        includedMb: { type: integer, minimum: 1 }
        usedMb: { type: integer, minimum: 0 }
        usedPercent: { type: integer, minimum: 0 }
        thresholdPercent: { type: integer, description: Warning threshold (80) }
        asOf: { type: string, format: date-time }
    UploadContentType:
      type: string
      enum: [image/jpeg, image/png, application/pdf]
    DocumentCategory:
      type: string
      enum: [meter-photo, other]
    Document:
      type: object
      required:
        - documentId
        - fileName
        - contentType
        - category
        - sizeBytes
        - status
        - createdAt
        - expiresAt
      properties:
        documentId: { type: string }
        fileName: { type: string }
        contentType: { $ref: "#/components/schemas/UploadContentType" }
        category: { $ref: "#/components/schemas/DocumentCategory" }
        sizeBytes: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [pending, uploaded, rejected]
          description: pending until the file arrives; rejected if it failed the checks
        createdAt: { type: string, format: date-time }
        uploadedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    UploadUrlRequest:
      type: object
      required: [fileName, contentType, sizeBytes]
      additionalProperties: false
      properties:
        fileName: { type: string, minLength: 1, maxLength: 120 }
        contentType: { $ref: "#/components/schemas/UploadContentType" }
        sizeBytes: { type: integer, minimum: 1, maximum: 5242880 }
        category: { $ref: "#/components/schemas/DocumentCategory" }
    UploadTicket:
      type: object
      required: [documentId, uploadUrl, method, headers, expiresAt]
      properties:
        documentId: { type: string }
        uploadUrl: { type: string, format: uri }
        method: { type: string, const: PUT }
        headers:
          type: object
          description: Headers the upload must send unchanged (part of the signature)
          additionalProperties: { type: string }
        expiresAt: { type: string, format: date-time }
    LegacySystem:
      type: string
      enum: [utility, telco]
    LegacyAccount:
      type: object
      required: [system, customerNumber]
      properties:
        system: { $ref: "#/components/schemas/LegacySystem" }
        customerNumber: { type: string, examples: [V-1000123, T/88-4711] }
    LinkOffer:
      type: object
      required:
        [customerId, account, candidate, displayName, address, matchedOn, score, status, offeredAt]
      properties:
        customerId: { type: string }
        account: { $ref: "#/components/schemas/LegacyAccount" }
        candidate: { $ref: "#/components/schemas/LegacyAccount" }
        displayName: { type: string }
        address: { type: string, examples: ["Hauptstraße 5, 04103 Leipzig"] }
        matchedOn:
          type: array
          items: { type: string, enum: [name, address, birthDate, email, phone] }
        score: { type: number, minimum: 0, maximum: 1 }
        status: { type: string, enum: [offered, linked] }
        offeredAt: { type: string, format: date-time }
        linkedAt: { type: string, format: date-time }
    LinkRequest:
      type: object
      required: [system, customerNumber, password]
      additionalProperties: false
      properties:
        system: { $ref: "#/components/schemas/LegacySystem" }
        customerNumber: { type: string }
        password: { type: string, maxLength: 200 }
    MigrationCorrections:
      type: object
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        postalCode: { type: string, pattern: "^\\d{5}$" }
        street: { type: string }
        houseNumber: { type: string }
        city: { type: string }
    MigrationRecordStatus:
      type: string
      enum: [pending-lazy, queued, migrated, linked, clarification, failed]
    MigrationRecord:
      type: object
      required: [id, system, customerNumber, displayName, status, attempts, updatedAt]
      properties:
        id: { type: string }
        system: { $ref: "#/components/schemas/LegacySystem" }
        customerNumber: { type: string }
        displayName: { type: string }
        status: { $ref: "#/components/schemas/MigrationRecordStatus" }
        code:
          type: string
          enum:
            [
              missing-required-field,
              invalid-field,
              legacy-unavailable,
              identity-conflict,
              unexpected,
            ]
        message: { type: string }
        fields: { type: array, items: { type: string } }
        attempts: { type: integer }
        updatedAt: { type: string, format: date-time }
    MigrationCounts:
      type: object
      required: [read, migrated, skippedActive, alreadyMigrated, clarification, failed]
      properties:
        read: { type: integer }
        migrated: { type: integer }
        skippedActive: { type: integer }
        alreadyMigrated: { type: integer }
        clarification: { type: integer }
        failed: { type: integer }
    MigrationRun:
      type: object
      required: [runId, system, status, startedAt, startedBy, processed, counts]
      properties:
        runId: { type: string }
        system: { $ref: "#/components/schemas/LegacySystem" }
        status: { type: string, enum: [running, completed] }
        startedAt: { type: string, format: date-time }
        startedBy: { type: string }
        completedAt: { type: string, format: date-time }
        dispatched: { type: integer }
        processed: { type: integer }
        counts: { $ref: "#/components/schemas/MigrationCounts" }
    MigrationStatus:
      type: object
      required: [systems, clarifications, deadLetters, runs, timeline]
      properties:
        systems:
          type: array
          items:
            type: object
            required: [system, counts]
            properties:
              system: { $ref: "#/components/schemas/LegacySystem" }
              total:
                {
                  type: integer,
                  description: Records in the legacy system; missing while it is unreachable,
                }
              counts:
                type: object
                additionalProperties: { type: integer }
                description: Number of records per `MigrationRecordStatus`
        clarifications:
          type: array
          items: { $ref: "#/components/schemas/MigrationRecord" }
        deadLetters:
          type: array
          items: { $ref: "#/components/schemas/MigrationRecord" }
        runs:
          type: array
          items: { $ref: "#/components/schemas/MigrationRun" }
        timeline:
          type: array
          items:
            type: object
            required: [eventId, source, detailType, occurredAt, summary]
            properties:
              eventId: { type: string }
              source: { type: string }
              detailType: { type: string }
              occurredAt: { type: string, format: date-time }
              summary: { type: string, description: Ids and accounts only, no personal data }
    TenantStatus:
      type: string
      enum: [provisioning, active, quota-exceeded, tearing-down, deleted]
    QuotaCounter:
      type: object
      required: [used, limit]
      properties:
        used: { type: integer }
        limit: { type: integer }
    QuotaUsage:
      type: object
      required: [api, events, uploads]
      properties:
        api: { $ref: "#/components/schemas/QuotaCounter" }
        events: { $ref: "#/components/schemas/QuotaCounter" }
        uploads: { $ref: "#/components/schemas/QuotaCounter" }
    PassSummary:
      type: object
      required: [passId, tenantId, email, status, createdAt, validUntil, shortLived]
      properties:
        passId: { type: string }
        tenantId: { type: string }
        email: { type: string, format: email }
        status: { $ref: "#/components/schemas/TenantStatus" }
        createdAt: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        shortLived: { type: boolean }
        quota: { $ref: "#/components/schemas/QuotaUsage" }
    OwnPass:
      type: object
      required: [tenantId, status]
      properties:
        tenantId: { type: string }
        passId: { type: string }
        status:
          oneOf:
            - { $ref: "#/components/schemas/TenantStatus" }
            - { type: string, enum: [owner] }
        validUntil: { type: string, format: date-time }
        quota: { $ref: "#/components/schemas/QuotaUsage" }
        demoPassword: { type: string, description: Pass holder and owner only }
        demoPersons:
          type: array
          description: Pass holder and owner only
          items:
            type: object
            required: [name, system, signIn]
            properties:
              name: { type: string }
              system: { $ref: "#/components/schemas/LegacySystem" }
              signIn: { type: string, format: email }
    PlatformSettings:
      type: object
      required: [redemption, maxTenants, activeTenants]
      properties:
        redemption: { type: string, enum: [open, closed] }
        closedAt: { type: string, format: date-time, description: Only while closed }
        closedReason: { type: string, description: Only while closed }
        maxTenants: { type: integer, minimum: 0, maximum: 4 }
        activeTenants: { type: integer, minimum: 0 }
    SettingsUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        redemption: { type: string, enum: [open, closed] }
        maxTenants: { type: integer, minimum: 1, maximum: 4 }
    PassOffer:
      type: object
      required: [passDays, quotas, uploadMaxBytes, redemptionOpen]
      properties:
        passDays: { type: integer, minimum: 1 }
        quotas:
          type: object
          required: [api, events, uploads]
          properties:
            api: { type: integer, description: API calls per pass }
            events: { type: integer, description: Domain events per pass }
            uploads: { type: integer, description: Uploads per pass }
        uploadMaxBytes: { type: integer, description: Largest single upload }
        redemptionOpen: { type: boolean }
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
