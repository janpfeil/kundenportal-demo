openapi: 3.1.0
info:
  title: Kundenportal API
  version: 0.1.0
  description: >-
    REST API of the customer portal. The tenant is always taken from the access token,
    never from the URL. Errors follow RFC 9457 (problem details). Every operation lists
    the OAuth 2.0 scopes it requires; the API gateway enforces them per route.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api
security:
  - oidc: []
paths:
  /me:
    get:
      operationId: getMe
      summary: Profile of the signed-in customer (created on first access)
      security:
        - oidc: [kundenportal/profile.read]
      responses:
        "200":
          description: Customer profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "401": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateMe
      summary: Change editable profile fields
      security:
        - oidc: [kundenportal/profile.write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerUpdate" }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /notifications:
    get:
      operationId: listNotifications
      summary: Demo mailbox of the signed-in customer, newest first
      security:
        - oidc: [kundenportal/notifications.read]
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
        "401": { $ref: "#/components/responses/Problem" }
  /notifications/{notificationId}:
    patch:
      operationId: markNotificationRead
      summary: Mark a notification as read
      security:
        - oidc: [kundenportal/notifications.write]
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [read]
              properties:
                read: { type: boolean, const: true }
      responses:
        "204": { description: Marked as read }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /contracts:
    get:
      operationId: listContracts
      summary: Contracts of the signed-in customer across all divisions
      description: >-
        A newly registered customer receives demo contracts (electricity, gas, mobile)
        a moment after the first sign-in; until then the list is empty.
      security:
        - oidc: [kundenportal/contracts.read]
      responses:
        "200":
          description: Contracts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Contract" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: concludeContract
      summary: Conclude a contract for an active product of the catalogue
      description: >-
        The customer orders an option of a product with status `active`. Metered
        divisions need the meter number and the meter reading at the start; the start
        date lies between today and 90 days ahead (German dates). The contract can be
        withdrawn within 14 days. Publishes `ContractChanged` (`created`, initiated by
        the customer); the mailbox confirms it.
      security:
        - oidc: [kundenportal/contracts.write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContractOrder" }
      responses:
        "201":
          description: The new contract
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /contracts/{contractId}:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    get:
      operationId: getContract
      summary: One contract of the signed-in customer
      security:
        - oidc: [kundenportal/contracts.read]
      responses:
        "200":
          description: Contract
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateContract
      summary: Change the monthly installment or the tariff option
      description: >-
        The installment of a metered contract (electricity, gas, water) may be set in
        whole euros between `installmentMinCent` and `installmentMaxCent`. A new tariff
        option moves that range and keeps the installment inside it; for internet and
        mobile the monthly price follows the option. Publishes `ContractChanged`.
      security:
        - oidc: [kundenportal/contracts.write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContractUpdate" }
      responses:
        "200":
          description: Updated contract
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /contracts/{contractId}/readings:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    get:
      operationId: listMeterReadings
      summary: Meter readings of a contract, newest first
      description: The first entry is the reading at contract start.
      security:
        - oidc: [kundenportal/readings.read]
      responses:
        "200":
          description: Meter readings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MeterReading" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: submitMeterReading
      summary: Submit a meter reading
      description: >-
        Plausibility: the contract has a meter, the date is not in the future (German
        time) and neither value nor date are below the latest reading. Publishes
        `MeterReadingSubmitted`; the contract domain then recalculates the installment.
      security:
        - oidc: [kundenportal/readings.write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewMeterReading" }
      responses:
        "201":
          description: Stored reading
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeterReading" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /contracts/{contractId}/usage:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    get:
      operationId: getDataUsage
      summary: Data volume used this month (mobile contracts, demo values)
      security:
        - oidc: [kundenportal/readings.read]
      responses:
        "200":
          description: Data usage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataUsage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /contracts/{contractId}/consumption:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    get:
      operationId: getConsumptionHistory
      summary: Monthly consumption of a metered contract, key figures and the next reading due
      description: >-
        Aggregates the meter readings: every span between two readings is spread over its
        days with the division's standard load profile (electricity H0, gas heating,
        water flat) and summed per month. Months no pair of readings covers are estimated
        from the contract's estimated annual consumption with the same profile
        (`basis: estimate`). Readings are due quarterly: three months after the latest
        one; if that has passed, within the next 14 days.
      security:
        - oidc: [kundenportal/readings.read]
      responses:
        "200":
          description: Consumption history of the last 12 complete months and the 12 before
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumptionHistory" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /documents:
    get:
      operationId: listDocuments
      summary: Documents of the signed-in customer, newest first
      security:
        - oidc: [kundenportal/documents.read]
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Document" }
        "401": { $ref: "#/components/responses/Problem" }
  /documents/upload-url:
    post:
      operationId: createUploadUrl
      summary: Announce an upload and get a presigned PUT URL
      description: >-
        The URL is valid for five minutes and accepts exactly the announced content type
        and size (both are signed): send `PUT` with the returned headers and the file as
        body. After the upload arrives the document becomes `uploaded` and
        `DocumentUploaded` is published. Files are deleted after seven days. A demo pass
        may request 20 upload URLs; after that the answer is 429 ("Kontingent erschöpft").
      security:
        - oidc: [kundenportal/documents.write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadUrlRequest" }
      responses:
        "201":
          description: Upload ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadTicket" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /me/links:
    get:
      operationId: listLinks
      summary: Offers to link a second legacy account, and confirmed links
      description: >-
        After a migration the portal looks for the same person in the other legacy system
        (name plus normalised address, birth date or email). Each hit is an offer here and
        in the mailbox (`DuplicateCandidateFound`).
      security:
        - oidc: [kundenportal/profile.read]
      responses:
        "200":
          description: Link offers of the signed-in customer
          content:
            application/json:
              schema:
                type: object
                required: [links]
                properties:
                  links:
                    type: array
                    items: { $ref: "#/components/schemas/LinkOffer" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: confirmLink
      summary: Link an offered legacy account (proof by its password)
      description: >-
        The password of the other legacy account proves ownership; it is checked by that
        legacy system (utility REST or the telco's Keycloak) and never stored. The
        account's contracts move to the signed-in customer (`AccountsLinked`). Repeating
        a confirmed link answers the link again.
      security:
        - oidc: [kundenportal/profile.write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkRequest" }
      responses:
        "200":
          description: The link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkOffer" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /migration/status:
    get:
      operationId: getMigrationStatus
      summary: Migration cockpit — progress, clarification cases, dead letters, timeline
      description: Owner only (Cognito group `owner`).
      security:
        - oidc: [kundenportal/migration.read]
      responses:
        "200":
          description: Cockpit data of the caller's tenant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /migration/search:
    get:
      operationId: searchMigration
      summary: Cockpit search over legacy accounts and timeline events of the caller's tenant
      description: >-
        Case-insensitive substring match on customer number, name, status and problem of
        the migration records and on type, summary and id of the timeline events (seven
        days). At most 10 hits each, newest first. Tenants (owner only) come from
        `GET /tenancy/passes`.
      security:
        - oidc: [kundenportal/migration.read]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 60 }
      responses:
        "200":
          description: Hits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationSearchResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /migration/bulk:
    post:
      operationId: startBulkMigration
      summary: Start the bulk import of the inactive accounts of one legacy system
      description: >-
        Owner only. Accounts without sign-in for 12 months are taken over without their
        password (`PasswordResetRequired`); active ones wait for their first sign-in
        (lazy migration). Runs asynchronously; progress in `/migration/status`.
      security:
        - oidc: [kundenportal/migration.write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [system]
              additionalProperties: false
              properties:
                system: { $ref: "#/components/schemas/LegacySystem" }
      responses:
        "202":
          description: Run started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationRun" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /migration/reset:
    post:
      operationId: resetMigration
      summary: Demo reset — remove migrated accounts and the migration state
      description: >-
        Owner only. Deletes the portal accounts created by the migration (lazy and bulk;
        never the caller's own), the tenant's migration records and runs, and empties the
        migration DLQ, so the journeys can be shown again. The legacy systems keep their
        data.
      security:
        - oidc: [kundenportal/migration.write]
      responses:
        "200":
          description: What was removed
          content:
            application/json:
              schema:
                type: object
                required: [accountsRemoved, recordsRemoved]
                properties:
                  accountsRemoved: { type: integer }
                  recordsRemoved: { type: integer }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /migration/dlq/{recordId}/redrive:
    post:
      operationId: redriveMigrationRecord
      summary: Process a failed record again, optionally with corrections
      description: >-
        Owner only. Takes the record's task out of the migration dead-letter queue and
        hands it to the processor again. Corrections (e.g. a missing postal code) apply
        to the takeover only; the legacy system stays untouched.
      security:
        - oidc: [kundenportal/migration.write]
      parameters:
        - name: recordId
          in: path
          required: true
          description: Opaque id from `MigrationStatus.deadLetters[].id`
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                corrections: { $ref: "#/components/schemas/MigrationCorrections" }
      responses:
        "202":
          description: Record queued again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationRecord" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tenancy/invitations:
    post:
      operationId: createInvitation
      summary: Create an invitation link for a demo pass
      description: >-
        Owner only (Cognito group `owner`). The link is valid for 14 days and can be
        redeemed once; its token sits in the URL fragment and is stored only as a hash.
        `validMinutes` creates a short test pass (end-to-end tests) whose holder gets no
        Cognito mail.
      security:
        - oidc: [kundenportal/tenancy.admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
                validMinutes: { type: integer, minimum: 1, maximum: 60 }
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                type: object
                required: [invitationId, link, expiresAt]
                properties:
                  invitationId: { type: string }
                  link: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /tenancy/passes:
    get:
      operationId: listPasses
      summary: All demo passes with status and quota usage
      description: Owner only.
      security:
        - oidc: [kundenportal/tenancy.admin]
      responses:
        "200":
          description: Passes, newest first
          content:
            application/json:
              schema:
                type: object
                required: [passes]
                properties:
                  passes:
                    type: array
                    items: { $ref: "#/components/schemas/PassSummary" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /tenancy/overview:
    get:
      operationId: getPassOverview
      summary: Key figures of the pass administration and the open invitations
      description: >-
        Owner only. Open invitations come from an index item per invitation
        (`PLATFORM` / `INVITE#<id>`); API calls per day from the day attributes the quota
        guard adds in the same update as the total (pass tenants only, German days).
      security:
        - oidc: [kundenportal/tenancy.admin]
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassOverview" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /tenancy/passes/{passId}/revoke:
    post:
      operationId: revokePass
      summary: End a demo pass early
      description: Owner only. The tenant is torn down asynchronously (`DemoPassExpired`).
      security:
        - oidc: [kundenportal/tenancy.admin]
      parameters:
        - name: passId
          in: path
          required: true
          schema: { type: string }
      responses:
        "202":
          description: Teardown started
          content:
            application/json:
              schema:
                type: object
                required: [passId, tenantId, status]
                properties:
                  passId: { type: string }
                  tenantId: { type: string }
                  status: { $ref: "#/components/schemas/TenantStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tenancy/pass:
    get:
      operationId: getOwnPass
      summary: The demo pass of the caller's tenant
      description: >-
        Status, end date and quota of the pass behind the tenant in the token. The pass
        holder (group `pass`) and the owner also get the demo persons' sign-in names and
        the tenant's demo password. For the owner's tenant the status is `owner`.
      security:
        - oidc: [kundenportal/tenancy.read]
      responses:
        "200":
          description: Own pass
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnPass" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /tenancy/pass/activate:
    post:
      operationId: activateOwnPass
      summary: Start the pass with the holder's first sign-in
      description: >-
        Called by the portal after a sign-in. For the pass holder (group `pass`) the
        first call records the activation and moves the end to `passHours` from now
        (short test passes keep their minutes); later calls change nothing. Answers the
        own pass like `getOwnPass`. Everyone else gets 204 and nothing happens.
      security:
        - oidc: [kundenportal/tenancy.read]
      responses:
        "200":
          description: Own pass after the activation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnPass" }
        "204": { description: Not a pass holder; nothing to activate }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /tenancy/settings:
    get:
      operationId: getSettings
      summary: Platform settings of the demo passes
      description: >-
        Owner only. Kill switch (`redemption`, with when and why it was closed), the cap
        of concurrent pass tenants and how many are in use (every tenant that is not
        deleted, including ones being set up or torn down).
      security:
        - oidc: [kundenportal/tenancy.admin]
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformSettings" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateSettings
      summary: Open or close redeeming and set the cap of concurrent pass tenants
      description: >-
        Owner only. At least one field. Reopening clears `closedAt` and `closedReason`;
        closing keeps an earlier reason (e.g. the budget alarm's). The cap is at most 4:
        each pass tenant has its own table with 5 read and 5 write capacity units, and
        the free tier's 25 units cover the base table plus four tenants. A cap below the
        tenants in use only stops new redemptions.
      security:
        - oidc: [kundenportal/tenancy.admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsUpdate" }
      responses:
        "200":
          description: Settings after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformSettings" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /tenancy/offer:
    get:
      operationId: getOffer
      summary: What a demo pass offers, for the redeem page
      description: >-
        Public and the same for every visitor (no personal data); cacheable for 60
        seconds (`Cache-Control: public, max-age=60`). Duration, quotas and upload size
        come from the configuration; `redemptionOpen` is false while redeeming is
        closed or every pass tenant is taken.
      security: []
      responses:
        "200":
          description: Offer
          headers:
            Cache-Control:
              schema: { type: string, example: "public, max-age=60" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassOffer" }
  /tenancy/challenge:
    get:
      operationId: getRedeemChallenge
      summary: ALTCHA proof-of-work challenge for redeeming a link
      description: >-
        Public. A signed challenge (protocol v2, PBKDF2/SHA-256) the ALTCHA widget solves
        in about a second; valid for 10 minutes.
      security: []
      responses:
        "200":
          description: Challenge
          content:
            application/json:
              schema:
                type: object
                required: [parameters, signature]
                properties:
                  parameters: { type: object, additionalProperties: true }
                  signature: { type: string }
  /tenancy/redeem:
    post:
      operationId: redeemInvitation
      summary: Redeem an invitation link and receive a demo pass
      description: >-
        Public. Needs a solved ALTCHA challenge (each one once); at most 10 attempts per
        address and hour. The tenant is set up asynchronously; the holder receives the
        one-time password of the new account by e-mail.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, altcha]
              additionalProperties: false
              properties:
                token: { type: string, description: The token from the link's fragment }
                altcha: { type: string, description: Base64 payload of the ALTCHA widget }
      responses:
        "202":
          description: Pass issued, tenant being set up
          content:
            application/json:
              schema:
                type: object
                required: [passId, statusUrl]
                properties:
                  passId: { type: string }
                  statusUrl: { type: string, format: uri }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /contracts/{contractId}/termination:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    post:
      operationId: requestTermination
      summary: Give notice to terminate the contract
      description: >-
        Ends the contract at `effectiveDate`, at the earliest at
        `Contract.earliestTerminationDate`: the end of the minimum term, afterwards the
        end of the month once the notice period has passed. Without a date, the earliest
        one. The contract stays active until then; the notice can be taken back.
        Publishes `ContractChanged` (`termination`).
      security:
        - oidc: [kundenportal/contracts.write]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TerminationRequest" }
      responses:
        "200":
          description: The contract with its pending termination
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: cancelTermination
      summary: Take back a pending termination
      description: Possible until the termination is effective. Publishes `ContractChanged` (`terminationCancelled`).
      security:
        - oidc: [kundenportal/contracts.write]
      responses:
        "200":
          description: The contract running on
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /contracts/{contractId}/withdrawal:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    post:
      operationId: withdrawContract
      summary: Withdraw from a contract within 14 days of concluding it
      description: >-
        Only contracts the customer concluded in the portal, until
        `Contract.withdrawableUntil`. Ends the contract at once. Publishes
        `ContractChanged` (`withdrawal`).
      security:
        - oidc: [kundenportal/contracts.write]
      responses:
        "200":
          description: The withdrawn contract
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /products:
    get:
      operationId: listProducts
      summary: Products a customer may order (status `active`), per division
      security:
        - oidc: [kundenportal/contracts.read]
      parameters:
        - name: division
          in: query
          schema: { $ref: "#/components/schemas/Division" }
      responses:
        "200":
          description: Orderable products
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /admin/overview:
    get:
      operationId: getOperatorOverview
      summary: Key figures of the operator's cockpit (contracts, orders, terminations)
      description: Operator only (Cognito group `owner`, or `pass` in the own pass tenant).
      security:
        - oidc: [kundenportal/admin.read]
      responses:
        "200":
          description: Key figures of the caller's tenant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorOverview" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /admin/customers:
    get:
      operationId: listCustomers
      summary: Customers of the tenant with search, filters, sorting and pages
      description: >-
        Operator only. Reads the tenant's customer directory (one partition, no scan);
        `q` matches name, e-mail, customer id, city and legacy account numbers.
      security:
        - oidc: [kundenportal/admin.read]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 60 } }
        - name: origin
          in: query
          schema: { type: string, enum: [registration, legacy-utility, legacy-telco] }
        - { name: division, in: query, schema: { $ref: "#/components/schemas/Division" } }
        - name: contracts
          in: query
          description: Customers with at least one contract in this state
          schema: { type: string, enum: [active, pending-termination, terminated, none] }
        - name: sort
          in: query
          schema: { type: string, enum: [name, createdAt], default: createdAt }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: One page of customers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /admin/customers/{customerId}:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    get:
      operationId: getCustomerAsOperator
      summary: One customer of the tenant with profile and contract summary
      security:
        - oidc: [kundenportal/admin.read]
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerSummary" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /admin/customers/{customerId}/notifications:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    get:
      operationId: listCustomerNotifications
      summary: The customer's mailbox as the operator sees it (read only)
      security:
        - oidc: [kundenportal/admin.read]
      responses:
        "200":
          description: Notifications, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /admin/customers/{customerId}/documents:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    get:
      operationId: listCustomerDocuments
      summary: The customer's documents as the operator sees them (metadata only)
      security:
        - oidc: [kundenportal/admin.read]
      responses:
        "200":
          description: Documents, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /admin/contracts:
    get:
      operationId: listContractsAsOperator
      summary: Contracts of the tenant with search, filters and pages
      description: >-
        Operator only. Reads the tenant's contract directory (one partition, no scan);
        `q` matches contract id, meter number, tariff and product.
      security:
        - oidc: [kundenportal/admin.read]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 60 } }
        - { name: division, in: query, schema: { $ref: "#/components/schemas/Division" } }
        - name: status
          in: query
          schema: { type: string, enum: [active, pending-termination, terminated, blocked] }
        - { name: productId, in: query, schema: { type: string } }
        - { name: customerId, in: query, schema: { type: string } }
        - name: endsBefore
          in: query
          description: Minimum term or pending termination ends on or before this date
          schema: { type: string, format: date }
        - name: sort
          in: query
          schema: { type: string, enum: [startDate, endDate, updatedAt], default: updatedAt }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: One page of contracts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /admin/contracts/{contractId}:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    get:
      operationId: getContractAsOperator
      summary: One contract of the tenant with its history
      security:
        - oidc: [kundenportal/admin.read]
      responses:
        "200":
          description: Contract and history, newest entry first
          content:
            application/json:
              schema:
                type: object
                required: [contract, history]
                properties:
                  contract: { $ref: "#/components/schemas/OperatorContract" }
                  history:
                    type: array
                    items: { $ref: "#/components/schemas/ContractHistoryEntry" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /admin/contracts/{contractId}/actions:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    post:
      operationId: actOnContract
      summary: The operator controls a contract (product, price, installment, termination, block)
      description: >-
        Every action needs a reason, is kept in the contract's history and publishes
        `ContractChanged` (initiated by the operator) — the customer's mailbox tells
        what changed and why.
      security:
        - oidc: [kundenportal/admin.write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContractAction" }
      responses:
        "200":
          description: The changed contract
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorContract" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /admin/contracts/{contractId}/readings:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    get:
      operationId: listReadingsAsOperator
      summary: Meter readings of a contract of the tenant, newest first
      security:
        - oidc: [kundenportal/admin.read]
      responses:
        "200":
          description: Meter readings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MeterReading" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /admin/products:
    get:
      operationId: listProductsAsOperator
      summary: The tenant's product catalogue in every status, with contract counts
      security:
        - oidc: [kundenportal/admin.read]
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createProduct
      summary: Create a product (status `draft`, price version 1)
      security:
        - oidc: [kundenportal/admin.write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: The new product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /admin/products/{productId}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      operationId: getProductAsOperator
      summary: One product with all price versions and contract counts
      security:
        - oidc: [kundenportal/admin.read]
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateProduct
      summary: Edit texts and terms, or move the status (draft → active → retiring → archived)
      description: >-
        Prices change only through a new price version. `archived` needs a product
        without running contracts. Publishes `ProductChanged`.
      security:
        - oidc: [kundenportal/admin.write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductUpdate" }
      responses:
        "200":
          description: The changed product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /admin/products/{productId}/versions:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    post:
      operationId: createPriceVersion
      summary: New prices for the product's options from a date on
      description: >-
        New contracts get the new version from `validFrom`; running contracts keep their
        version until the operator moves them (`ContractAction` `applyPriceVersion`).
        Publishes `ProductChanged` (`priceVersion`).
      security:
        - oidc: [kundenportal/admin.write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PriceVersionInput" }
      responses:
        "201":
          description: The product with its new current version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
components:
  parameters:
    ContractId:
      name: contractId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CustomerId:
      name: customerId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 80 }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9-]{2,40}$" }
  securitySchemes:
    oidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Access token (JWT) of any standard OpenID Connect provider trusted by the API
        gateway; in the demo this is the Amazon Cognito user pool. The token must carry
        the scopes listed on each operation (`scope` claim, space separated).
  responses:
    Problem:
      description: Error as problem details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Locale:
      type: string
      enum: [de, en]
    Customer:
      type: object
      required: [customerId, email, displayName, locale, origin, createdAt]
      properties:
        customerId: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        locale: { $ref: "#/components/schemas/Locale" }
        origin:
          type: string
          enum: [registration, legacy-utility, legacy-telco]
        createdAt: { type: string, format: date-time }
        address: { $ref: "#/components/schemas/PostalAddress" }
        phone: { type: string, description: Taken over from a legacy system }
        legacyAccounts:
          type: array
          description: Legacy accounts behind this customer, e.g. `utility:V-1000123`
          items: { type: string }
    PostalAddress:
      type: object
      required: [street, houseNumber, postalCode, city]
      properties:
        street: { type: string }
        houseNumber: { type: string }
        postalCode: { type: string, pattern: "^\\d{5}$" }
        city: { type: string }
    CustomerUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
        locale: { $ref: "#/components/schemas/Locale" }
    Notification:
      type: object
      required: [notificationId, kind, title, body, createdAt, read]
      properties:
        notificationId: { type: string }
        kind: { type: string, enum: [welcome, info, warning] }
        title: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }
    Division:
      type: string
      enum: [electricity, gas, water, internet, mobile]
    MeterUnit:
      type: string
      enum: [kWh, m3]
    Contract:
      type: object
      description: Amounts are integer euro cents.
      required:
        - contractId
        - division
        - tariffName
        - tariffOption
        - tariffOptions
        - monthlyInstallmentCent
        - installmentAdjustable
        - monthlyPriceCent
        - startDate
        - minimumTermMonths
        - minimumTermEndDate
        - status
        - updatedAt
      properties:
        contractId: { type: string, format: uuid }
        division: { $ref: "#/components/schemas/Division" }
        tariffName: { type: string }
        tariffOption: { type: string }
        tariffOptions:
          type: array
          description: Options the customer may switch to
          items: { type: string }
        monthlyInstallmentCent:
          type: integer
          minimum: 0
          description: Installment (metered) or fixed monthly price (internet, mobile)
        installmentAdjustable: { type: boolean }
        installmentMinCent: { type: integer, minimum: 0 }
        installmentMaxCent: { type: integer, minimum: 0 }
        meterNumber: { type: string }
        unit: { $ref: "#/components/schemas/MeterUnit" }
        workPriceCent: { type: integer, minimum: 0, description: Price per kWh or m³ }
        monthlyPriceCent:
          type: integer
          minimum: 0
          description: Monthly base price (metered) or monthly price of the option
        estimatedAnnualConsumption: { type: number, minimum: 0 }
        dataVolumeMb: { type: integer, minimum: 1 }
        startDate: { type: string, format: date }
        minimumTermMonths: { type: integer, minimum: 0 }
        minimumTermEndDate: { type: string, format: date }
        status:
          type: string
          enum: [active, terminated]
          description: "`terminated` once a termination took effect or after a withdrawal"
        updatedAt: { type: string, format: date-time }
        productId: { type: string, description: Product of the catalogue (phase 7) }
        productVersion: { type: integer, minimum: 1, description: Price version in use }
        noticePeriodMonths: { type: integer, minimum: 0 }
        earliestTerminationDate:
          type: string
          format: date
          description: Earliest end a notice given today reaches
        termination: { $ref: "#/components/schemas/ContractTermination" }
        withdrawableUntil:
          type: string
          format: date
          description: Last day of the withdrawal period (contracts concluded in the portal)
        blocked:
          type: boolean
          description: Blocked by the operator; the customer cannot change it
    ContractTermination:
      type: object
      required: [kind, effectiveDate, requestedAt, by]
      properties:
        kind: { type: string, enum: [termination, withdrawal] }
        effectiveDate: { type: string, format: date }
        requestedAt: { type: string, format: date-time }
        by: { type: string, enum: [customer, operator] }
        reason: { type: string, description: The operator's reason, if any }
    ContractOrder:
      type: object
      required: [productId, optionId, startDate, consent]
      additionalProperties: false
      properties:
        productId: { type: string, pattern: "^[a-z0-9-]{2,40}$" }
        optionId: { type: string, minLength: 1, maxLength: 40 }
        startDate: { type: string, format: date }
        meterNumber:
          { type: string, minLength: 4, maxLength: 30, description: Metered divisions only }
        startReading:
          { type: number, minimum: 0, maximum: 1000000000, description: Metered divisions only }
        consent:
          type: boolean
          const: true
          description: The customer accepts terms and price (demo, no legal text)
    TerminationRequest:
      type: object
      additionalProperties: false
      properties:
        effectiveDate:
          type: string
          format: date
          description: Wished end; not before `earliestTerminationDate`
    OperatorContract:
      allOf:
        - { $ref: "#/components/schemas/Contract" }
        - type: object
          required: [customerId]
          properties:
            customerId: { type: string }
            customerName: { type: string }
    ContractHistoryEntry:
      type: object
      required: [at, change, by]
      properties:
        at: { type: string, format: date-time }
        change:
          type: string
          enum:
            [
              created,
              installment,
              tariffOption,
              product,
              priceVersion,
              termination,
              terminationCancelled,
              withdrawal,
              blocked,
              unblocked,
              taken-over,
            ]
        by: { type: string, enum: [customer, operator, system] }
        reason: { type: string }
        summary: { type: string, description: What changed, e.g. "Abschlag 87 € → 95 €" }
    ContractAction:
      oneOf:
        - type: object
          required: [type, reason, optionId]
          additionalProperties: false
          properties:
            type: { type: string, const: changeOption }
            optionId: { type: string }
            reason: { $ref: "#/components/schemas/ActionReason" }
        - type: object
          required: [type, reason, productId, optionId]
          additionalProperties: false
          properties:
            type: { type: string, const: changeProduct }
            productId: { type: string }
            optionId: { type: string }
            reason: { $ref: "#/components/schemas/ActionReason" }
        - type: object
          required: [type, reason]
          additionalProperties: false
          properties:
            type: { type: string, const: applyPriceVersion }
            reason: { $ref: "#/components/schemas/ActionReason" }
        - type: object
          required: [type, reason, monthlyInstallmentCent]
          additionalProperties: false
          properties:
            type: { type: string, const: setInstallment }
            monthlyInstallmentCent: { type: integer, minimum: 100 }
            reason: { $ref: "#/components/schemas/ActionReason" }
        - type: object
          required: [type, reason]
          additionalProperties: false
          properties:
            type: { type: string, const: terminate }
            effectiveDate:
              type: string
              format: date
              description: The operator may also end earlier than the customer could; not in the past
            reason: { $ref: "#/components/schemas/ActionReason" }
        - type: object
          required: [type, reason]
          additionalProperties: false
          properties:
            type: { type: string, enum: [cancelTermination, block, unblock] }
            reason: { $ref: "#/components/schemas/ActionReason" }
    ActionReason:
      type: string
      minLength: 3
      maxLength: 300
      description: Shown in the history and to the customer
    ContractSummary:
      type: object
      required:
        [
          contractId,
          customerId,
          division,
          tariffName,
          tariffOption,
          monthlyInstallmentCent,
          startDate,
          minimumTermEndDate,
          status,
          updatedAt,
        ]
      properties:
        contractId: { type: string, format: uuid }
        customerId: { type: string }
        customerName: { type: string }
        division: { $ref: "#/components/schemas/Division" }
        productId: { type: string }
        productVersion: { type: integer }
        tariffName: { type: string }
        tariffOption: { type: string }
        monthlyInstallmentCent: { type: integer }
        meterNumber: { type: string }
        startDate: { type: string, format: date }
        minimumTermEndDate: { type: string, format: date }
        status: { type: string, enum: [active, terminated] }
        termination: { $ref: "#/components/schemas/ContractTermination" }
        blocked: { type: boolean }
        updatedAt: { type: string, format: date-time }
    ContractPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ContractSummary" }
        total: { type: integer, description: Matches of the filters across all pages }
        nextCursor: { type: string }
    CustomerSummary:
      type: object
      required: [customerId, displayName, email, origin, createdAt, contracts, divisions]
      properties:
        customerId: { type: string }
        displayName: { type: string }
        email: { type: string, format: email }
        origin: { type: string, enum: [registration, legacy-utility, legacy-telco] }
        createdAt: { type: string, format: date-time }
        locale: { $ref: "#/components/schemas/Locale" }
        address: { $ref: "#/components/schemas/PostalAddress" }
        phone: { type: string }
        legacyAccounts: { type: array, items: { type: string } }
        divisions:
          type: array
          description: Divisions with a running contract
          items: { $ref: "#/components/schemas/Division" }
        contracts:
          type: object
          required: [active, pendingTermination, terminated]
          properties:
            active: { type: integer }
            pendingTermination: { type: integer }
            terminated: { type: integer }
    CustomerPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CustomerSummary" }
        total: { type: integer }
        nextCursor: { type: string }
    OperatorOverview:
      type: object
      required: [contracts, byDivision, orders, terminations, endingSoon, days]
      properties:
        contracts:
          type: object
          required: [active, pendingTermination, terminated, blocked]
          properties:
            active: { type: integer }
            pendingTermination: { type: integer }
            terminated: { type: integer }
            blocked: { type: integer }
        byDivision:
          type: object
          description: Running contracts per division
          additionalProperties: { type: integer }
        days:
          type: array
          description: Last seven German days, oldest first
          minItems: 7
          maxItems: 7
          items: { type: string, format: date }
        orders:
          type: array
          description: Contracts concluded in the portal per day
          minItems: 7
          maxItems: 7
          items: { type: integer }
        terminations:
          type: array
          description: Terminations and withdrawals received per day
          minItems: 7
          maxItems: 7
          items: { type: integer }
        endingSoon:
          type: integer
          description: Running contracts whose termination takes effect within 30 days
    ProductStatus:
      type: string
      enum: [draft, active, retiring, archived]
    ProductOption:
      type: object
      required: [optionId, label, monthlyPriceCent]
      properties:
        optionId: { type: string, pattern: "^[a-z0-9-]{1,40}$" }
        label: { type: string, minLength: 1, maxLength: 60 }
        monthlyPriceCent:
          type: integer
          minimum: 0
          description: Base price (metered) or monthly price (internet, mobile)
        workPriceCent: { type: number, minimum: 0, description: Per kWh or m³; metered only }
        dataVolumeMb: { type: integer, minimum: 1, description: Mobile only }
        bandwidthMbit: { type: integer, minimum: 1, description: Internet only }
    PriceVersion:
      type: object
      required: [version, validFrom, createdAt, options]
      properties:
        version: { type: integer, minimum: 1 }
        validFrom: { type: string, format: date }
        createdAt: { type: string, format: date-time }
        options:
          type: array
          items: { $ref: "#/components/schemas/ProductOption" }
    Product:
      type: object
      required:
        [
          productId,
          division,
          name,
          description,
          status,
          minimumTermMonths,
          noticePeriodMonths,
          version,
          options,
          updatedAt,
        ]
      properties:
        productId: { type: string }
        division: { $ref: "#/components/schemas/Division" }
        name: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/ProductStatus" }
        unit: { $ref: "#/components/schemas/MeterUnit" }
        minimumTermMonths: { type: integer, minimum: 0 }
        noticePeriodMonths: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1, description: Current price version }
        options:
          type: array
          description: Options with the prices of the current version
          items: { $ref: "#/components/schemas/ProductOption" }
        versions:
          type: array
          description: All price versions, newest first (operator only)
          items: { $ref: "#/components/schemas/PriceVersion" }
        contractCount:
          type: object
          description: Running contracts per price version (operator only)
          additionalProperties: { type: integer }
        updatedAt: { type: string, format: date-time }
    ProductInput:
      type: object
      required:
        [productId, division, name, description, minimumTermMonths, noticePeriodMonths, options]
      additionalProperties: false
      properties:
        productId: { type: string, pattern: "^[a-z0-9-]{2,40}$" }
        division: { $ref: "#/components/schemas/Division" }
        name: { type: string, minLength: 2, maxLength: 60 }
        description: { type: string, maxLength: 400 }
        minimumTermMonths: { type: integer, minimum: 0, maximum: 36 }
        noticePeriodMonths: { type: integer, minimum: 0, maximum: 12 }
        validFrom: { type: string, format: date }
        options:
          type: array
          minItems: 1
          maxItems: 6
          items: { $ref: "#/components/schemas/ProductOption" }
    ProductUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 60 }
        description: { type: string, maxLength: 400 }
        minimumTermMonths: { type: integer, minimum: 0, maximum: 36 }
        noticePeriodMonths: { type: integer, minimum: 0, maximum: 12 }
        status: { $ref: "#/components/schemas/ProductStatus" }
    PriceVersionInput:
      type: object
      required: [validFrom, options]
      additionalProperties: false
      properties:
        validFrom: { type: string, format: date, description: Today or later }
        options:
          type: array
          minItems: 1
          maxItems: 6
          description: Prices of every option of the product (same option ids)
          items: { $ref: "#/components/schemas/ProductOption" }
    ContractUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        monthlyInstallmentCent:
          type: integer
          minimum: 1
          description: Whole euros (multiple of 100) within the contract's allowed range
        tariffOption: { type: string, minLength: 1, maxLength: 40 }
    MeterReading:
      type: object
      required: [readingId, value, unit, readAt, source, submittedAt]
      properties:
        readingId: { type: string }
        value: { type: number, minimum: 0 }
        unit: { $ref: "#/components/schemas/MeterUnit" }
        readAt: { type: string, format: date }
        source: { type: string, enum: [contract-start, customer] }
        submittedAt: { type: string, format: date-time }
    NewMeterReading:
      type: object
      required: [value, readAt]
      additionalProperties: false
      properties:
        value: { type: number, minimum: 0, maximum: 1000000000 }
        readAt: { type: string, format: date }
    DataUsage:
      type: object
      required: [contractId, month, includedMb, usedMb, usedPercent, thresholdPercent, asOf]
      properties:
        contractId: { type: string, format: uuid }
        month: { type: string, pattern: "^\\d{4}-\\d{2}$" }
        includedMb: { type: integer, minimum: 1 }
        usedMb: { type: integer, minimum: 0 }
        usedPercent: { type: integer, minimum: 0 }
        thresholdPercent: { type: integer, description: Warning threshold (80) }
        asOf: { type: string, format: date-time }
    ConsumptionMonth:
      type: object
      required: [month, value, previousYear, basis, previousBasis]
      properties:
        month: { type: string, pattern: "^\\d{4}-\\d{2}$" }
        value: { type: number, minimum: 0, description: Consumption in the contract's unit }
        previousYear: { type: number, minimum: 0, description: Same month one year earlier }
        basis:
          type: string
          enum: [readings, estimate]
          description: From readings, or estimated from the annual consumption
        previousBasis: { type: string, enum: [readings, estimate] }
    ConsumptionHistory:
      type: object
      required:
        [
          contractId,
          unit,
          months,
          total,
          previousTotal,
          averagePerMonth,
          nextReadingDue,
          readingDue,
        ]
      properties:
        contractId: { type: string, format: uuid }
        unit: { $ref: "#/components/schemas/MeterUnit" }
        months:
          type: array
          description: The last 12 complete months, oldest first
          minItems: 12
          maxItems: 12
          items: { $ref: "#/components/schemas/ConsumptionMonth" }
        total: { type: number, minimum: 0, description: Sum of the 12 months }
        previousTotal: { type: number, minimum: 0, description: Sum of the 12 months before }
        changePercent:
          type: number
          description: Change of `total` against `previousTotal`; missing if that is 0
        averagePerMonth: { type: number, minimum: 0 }
        latestReading: { $ref: "#/components/schemas/MeterReading" }
        nextReadingDue: { type: string, format: date }
        readingDue:
          type: boolean
          description: True if `nextReadingDue` is at most 14 days away (or passed)
        plausibleRange:
          type: object
          description: >-
            Range a reading taken today should lie in (a third to three times the
            expected consumption since the latest reading); a hint, the server only
            rejects values below the latest reading.
          required: [min, max, at]
          properties:
            min: { type: number, minimum: 0 }
            max: { type: number, minimum: 0 }
            at: { type: string, format: date }
    UploadContentType:
      type: string
      enum: [image/jpeg, image/png, application/pdf]
    DocumentCategory:
      type: string
      enum: [meter-photo, other]
    Document:
      type: object
      required:
        - documentId
        - fileName
        - contentType
        - category
        - sizeBytes
        - status
        - createdAt
        - expiresAt
      properties:
        documentId: { type: string }
        fileName: { type: string }
        contentType: { $ref: "#/components/schemas/UploadContentType" }
        category: { $ref: "#/components/schemas/DocumentCategory" }
        sizeBytes: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [pending, uploaded, rejected]
          description: pending until the file arrives; rejected if it failed the checks
        createdAt: { type: string, format: date-time }
        uploadedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    UploadUrlRequest:
      type: object
      required: [fileName, contentType, sizeBytes]
      additionalProperties: false
      properties:
        fileName: { type: string, minLength: 1, maxLength: 120 }
        contentType: { $ref: "#/components/schemas/UploadContentType" }
        sizeBytes: { type: integer, minimum: 1, maximum: 5242880 }
        category: { $ref: "#/components/schemas/DocumentCategory" }
    UploadTicket:
      type: object
      required: [documentId, uploadUrl, method, headers, expiresAt]
      properties:
        documentId: { type: string }
        uploadUrl: { type: string, format: uri }
        method: { type: string, const: PUT }
        headers:
          type: object
          description: Headers the upload must send unchanged (part of the signature)
          additionalProperties: { type: string }
        expiresAt: { type: string, format: date-time }
    LegacySystem:
      type: string
      enum: [utility, telco]
    LegacyAccount:
      type: object
      required: [system, customerNumber]
      properties:
        system: { $ref: "#/components/schemas/LegacySystem" }
        customerNumber: { type: string, examples: [V-1000123, T/88-4711] }
    LinkOffer:
      type: object
      required:
        [customerId, account, candidate, displayName, address, matchedOn, score, status, offeredAt]
      properties:
        customerId: { type: string }
        account: { $ref: "#/components/schemas/LegacyAccount" }
        candidate: { $ref: "#/components/schemas/LegacyAccount" }
        displayName: { type: string }
        address: { type: string, examples: ["Hauptstraße 5, 04103 Leipzig"] }
        matchedOn:
          type: array
          items: { type: string, enum: [name, address, birthDate, email, phone] }
        score: { type: number, minimum: 0, maximum: 1 }
        status: { type: string, enum: [offered, linked] }
        offeredAt: { type: string, format: date-time }
        linkedAt: { type: string, format: date-time }
    LinkRequest:
      type: object
      required: [system, customerNumber, password]
      additionalProperties: false
      properties:
        system: { $ref: "#/components/schemas/LegacySystem" }
        customerNumber: { type: string }
        password: { type: string, maxLength: 200 }
    MigrationCorrections:
      type: object
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        postalCode: { type: string, pattern: "^\\d{5}$" }
        street: { type: string }
        houseNumber: { type: string }
        city: { type: string }
    MigrationRecordStatus:
      type: string
      enum: [pending-lazy, queued, migrated, linked, clarification, failed]
    MigrationRecord:
      type: object
      required: [id, system, customerNumber, displayName, status, attempts, updatedAt]
      properties:
        id: { type: string }
        system: { $ref: "#/components/schemas/LegacySystem" }
        customerNumber: { type: string }
        displayName: { type: string }
        status: { $ref: "#/components/schemas/MigrationRecordStatus" }
        code:
          type: string
          enum:
            [
              missing-required-field,
              invalid-field,
              legacy-unavailable,
              identity-conflict,
              unexpected,
            ]
        message: { type: string }
        fields: { type: array, items: { type: string } }
        attempts: { type: integer }
        updatedAt: { type: string, format: date-time }
    MigrationCounts:
      type: object
      required: [read, migrated, skippedActive, alreadyMigrated, clarification, failed]
      properties:
        read: { type: integer }
        migrated: { type: integer }
        skippedActive: { type: integer }
        alreadyMigrated: { type: integer }
        clarification: { type: integer }
        failed: { type: integer }
    MigrationRun:
      type: object
      required: [runId, system, status, startedAt, startedBy, processed, counts]
      properties:
        runId: { type: string }
        system: { $ref: "#/components/schemas/LegacySystem" }
        status: { type: string, enum: [running, completed] }
        startedAt: { type: string, format: date-time }
        startedBy: { type: string }
        completedAt: { type: string, format: date-time }
        dispatched: { type: integer }
        processed: { type: integer }
        counts: { $ref: "#/components/schemas/MigrationCounts" }
    MigrationStatus:
      type: object
      required: [systems, clarifications, deadLetters, runs, timeline, trends]
      properties:
        systems:
          type: array
          items:
            type: object
            required: [system, counts, migratedToday]
            properties:
              system: { $ref: "#/components/schemas/LegacySystem" }
              migratedToday:
                type: integer
                description: Records migrated or linked since midnight (German time)
              total:
                {
                  type: integer,
                  description: Records in the legacy system; missing while it is unreachable,
                }
              counts:
                type: object
                additionalProperties: { type: integer }
                description: Number of records per `MigrationRecordStatus`
        clarifications:
          type: array
          items: { $ref: "#/components/schemas/MigrationRecord" }
        deadLetters:
          type: array
          items: { $ref: "#/components/schemas/MigrationRecord" }
        runs:
          type: array
          items: { $ref: "#/components/schemas/MigrationRun" }
        timeline:
          type: array
          items: { $ref: "#/components/schemas/TimelineEntry" }
        trends: { $ref: "#/components/schemas/MigrationTrends" }
    MigrationTrends:
      type: object
      description: >-
        Course of the last seven days (German days, oldest first), derived from the
        records: open clarification cases and dead letters at the end of each day.
      required: [days, clarifications, deadLetters, newClarifications, redriven]
      properties:
        days:
          type: array
          minItems: 7
          maxItems: 7
          items: { type: string, format: date }
        clarifications: { type: array, minItems: 7, maxItems: 7, items: { type: integer } }
        deadLetters: { type: array, minItems: 7, maxItems: 7, items: { type: integer } }
        newClarifications:
          type: integer
          description: Clarification cases raised in the last 24 hours
        redriven:
          type: integer
          description: Dead letters redriven in the last 24 hours that did not fail again
    TimelineEntry:
      type: object
      required: [eventId, source, detailType, occurredAt, summary]
      properties:
        eventId: { type: string }
        source: { type: string }
        detailType: { type: string }
        occurredAt: { type: string, format: date-time }
        summary: { type: string, description: Ids and accounts only, no personal data }
    MigrationSearchResult:
      type: object
      required: [query, accounts, events]
      properties:
        query: { type: string }
        accounts:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/MigrationRecord" }
        events:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/TimelineEntry" }
    TenantStatus:
      type: string
      enum: [provisioning, active, quota-exceeded, tearing-down, deleted]
    QuotaCounter:
      type: object
      required: [used, limit]
      properties:
        used: { type: integer }
        limit: { type: integer }
    QuotaUsage:
      type: object
      required: [api, events, uploads]
      properties:
        api: { $ref: "#/components/schemas/QuotaCounter" }
        events: { $ref: "#/components/schemas/QuotaCounter" }
        uploads: { $ref: "#/components/schemas/QuotaCounter" }
    PassSummary:
      type: object
      required: [passId, tenantId, email, status, createdAt, validUntil, shortLived]
      properties:
        passId: { type: string }
        tenantId: { type: string }
        email: { type: string, format: email }
        status: { $ref: "#/components/schemas/TenantStatus" }
        createdAt: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        shortLived: { type: boolean }
        activatedAt:
          type: string
          format: date-time
          description: First sign-in of the pass holder; absent until then
        lastActiveAt:
          type: string
          format: date-time
          description: Last API call of the tenant; absent before the first
        quota: { $ref: "#/components/schemas/QuotaUsage" }
    OwnPass:
      type: object
      required: [tenantId, status]
      properties:
        tenantId: { type: string }
        passId: { type: string }
        status:
          oneOf:
            - { $ref: "#/components/schemas/TenantStatus" }
            - { type: string, enum: [owner] }
        validUntil: { type: string, format: date-time }
        quota: { $ref: "#/components/schemas/QuotaUsage" }
        demoPassword: { type: string, description: Pass holder and owner only }
        demoPersons:
          type: array
          description: Pass holder and owner only
          items:
            type: object
            required: [name, system, signIn]
            properties:
              name: { type: string }
              system: { $ref: "#/components/schemas/LegacySystem" }
              signIn: { type: string, format: email }
    PlatformSettings:
      type: object
      required: [redemption, maxTenants, activeTenants]
      properties:
        redemption: { type: string, enum: [open, closed] }
        closedAt: { type: string, format: date-time, description: Only while closed }
        closedReason: { type: string, description: Only while closed }
        maxTenants: { type: integer, minimum: 0, maximum: 4 }
        activeTenants: { type: integer, minimum: 0 }
    SettingsUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        redemption: { type: string, enum: [open, closed] }
        maxTenants: { type: integer, minimum: 1, maximum: 4 }
    PassOverview:
      type: object
      required:
        [
          activeTenants,
          maxTenants,
          openInvitations,
          neverSignedIn,
          reminderHours,
          invitationDays,
          invitations,
          apiCalls,
        ]
      properties:
        activeTenants: { type: integer, minimum: 0 }
        maxTenants: { type: integer, minimum: 0 }
        openInvitations:
          type: integer
          description: Invitations neither redeemed nor expired
        neverSignedIn:
          type: integer
          description: Active passes whose holder has not signed in yet
        reminderHours:
          type: integer
          description: After how many hours without sign-in the holder is reminded
        invitationDays: { type: integer, description: How long an invitation can be redeemed }
        invitations:
          type: array
          description: Open invitations, newest first
          items:
            type: object
            required: [invitationId, email, createdAt, expiresAt, shortLived]
            properties:
              invitationId: { type: string }
              email: { type: string, format: email }
              createdAt: { type: string, format: date-time }
              expiresAt: { type: string, format: date-time }
              shortLived: { type: boolean }
        apiCalls:
          type: object
          required: [today, days]
          properties:
            today: { type: integer, minimum: 0 }
            days:
              type: array
              description: Last seven German days, oldest first; today last
              minItems: 7
              maxItems: 7
              items:
                type: object
                required: [date, calls]
                properties:
                  date: { type: string, format: date }
                  calls: { type: integer, minimum: 0 }
    PassOffer:
      type: object
      required: [passHours, quotas, uploadMaxBytes, redemptionOpen]
      properties:
        passHours:
          type: integer
          minimum: 1
          description: How long a pass lasts after redeeming and again after the first sign-in
        quotas:
          type: object
          required: [api, events, uploads]
          properties:
            api: { type: integer, description: API calls per pass }
            events: { type: integer, description: Domain events per pass }
            uploads: { type: integer, description: Uploads per pass }
        uploadMaxBytes: { type: integer, description: Largest single upload }
        redemptionOpen: { type: boolean }
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
